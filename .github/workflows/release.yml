name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    name: Build Debian Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian Package
        run: |
          chmod +x packaging/deb/build_deb.sh
          ./packaging/deb/build_deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-deb
          path: "*.deb"

  build-appimage:
    name: Build AppImage (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AppImageTool
        run: |
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x packaging/appimage/build_appimage.sh
          ./packaging/appimage/build_appimage.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-appimage
          path: "*.AppImage"

  build-arch:
    name: Build Arch Package (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch Linux Package
        run: |
          pacman -Syu --noconfirm base-devel git
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "makepkg -f --nodeps"
      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-arch
          path: "*.pkg.tar.zst"

  build-rpm:
    name: Build Fedora/RPM Package (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM Package
        run: |
          dnf install -y rpm-build python3-devel python3-setuptools
          chmod +x packaging/rpm/build_rpm.sh
          ./packaging/rpm/build_rpm.sh
      - name: Upload RPM Package
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-rpm
          path: "*.rpm"

  release:
    name: Create GitHub Release
    needs: [build-deb, build-appimage, build-arch, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
