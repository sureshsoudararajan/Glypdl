name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    name: Build Debian Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian Package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          export VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ]; then export VERSION="1.2.0"; fi
          chmod +x packaging/deb/build_deb.sh
          ./packaging/deb/build_deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-deb
          path: "*.deb"

  build-appimage:
    name: Build AppImage (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies and AppImageTool
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0 libgraphene-1.0-0
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x packaging/appimage/build_appimage.sh
          ./packaging/appimage/build_appimage.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-appimage
          path: "*.AppImage"

  build-arch:
    name: Build Arch Package (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch Linux Package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -n "$VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          fi
          pacman -Syu --noconfirm base-devel git
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "makepkg -f --nodeps"
      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-arch
          path: "*.pkg.tar.zst"

  build-rpm:
    name: Build Fedora/RPM Package (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM Package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          export VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ]; then export VERSION="1.2.0"; fi
          dnf install -y rpm-build python3-devel python3-pip python3-wheel python3-setuptools pyproject-rpm-macros
          chmod +x packaging/rpm/build_rpm.sh
          ./packaging/rpm/build_rpm.sh
      - name: Upload RPM Package
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-rpm
          path: "*.rpm"

  build-windows:
    name: Build Windows 11 App & Installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Dependencies
        run: msbuild windows/Glypdl.Windows.sln -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build Windows Solution
        run: msbuild windows/Glypdl.Windows.sln -p:Configuration=Release -p:Platform=x64

      - name: Run Windows Tests
        run: dotnet test windows/tests/Glypdl.Windows.Tests/Glypdl.Windows.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Publish Windows App (win-x64 Self-Contained)
        run: msbuild windows/src/Glypdl.Windows/Glypdl.Windows.csproj -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSelfContained=true -p:PublishDir=..\..\publish\

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Setup.exe
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v?(.+)$') { $matches[1] } else { "1.2.0" }
          New-Item -ItemType Directory -Path windows\dist -Force
          iscc /DMyAppVersion="$ver" windows/packaging/inno/setup.iss

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-windows
          path: windows/dist/*.exe

  build-extension:
    name: Build Firefox Extension (.xpi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Extension
        run: |
          cd extension
          npm ci
          npm run build
      - name: Upload Extension XPI
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-firefox-extension
          path: extension/*.xpi

  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist-android
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.2.0"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-android/Glypdl-${VERSION}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-android
          path: dist-android/*.apk

  release:
    name: Create GitHub Release
    needs: [build-deb, build-appimage, build-arch, build-rpm, build-windows, build-extension, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/**/*
          tag_name: ${{ github.ref_name }}
          name: Glypdl ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
