name: Windows Build & Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. 3.3.0)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 3.3.0)'
        required: false
        type: string
        default: '4.0.0'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows 11 App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Dependencies
        run: msbuild windows/Glypdl.Windows.sln -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build Windows Solution
        run: msbuild windows/Glypdl.Windows.sln -p:Configuration=Release -p:Platform=x64

      - name: Run Windows Tests
        run: dotnet test windows/tests/Glypdl.Windows.Tests/Glypdl.Windows.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Publish Windows App (win-x64 Self-Contained)
        run: msbuild windows/src/Glypdl.Windows/Glypdl.Windows.csproj -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSelfContained=true -p:PublishDir="${{ github.workspace }}\windows\publish\"

      - name: Bundle Latest Official yt-dlp Executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path windows\publish -Force
          Write-Host "Downloading latest official yt-dlp.exe from GitHub..."
          curl.exe -L -s -S -o "windows\publish\yt-dlp.exe" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          if (-not (Test-Path "windows\publish\yt-dlp.exe")) {
              throw "Failed to download yt-dlp.exe"
          }
          $size = (Get-Item "windows\publish\yt-dlp.exe").Length
          Write-Host "Successfully bundled yt-dlp.exe ($size bytes) into Windows app package"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Setup.exe
        shell: powershell
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver -or $ver -like "*/*" -or $ver -eq "main" -or $ver -notmatch '^\d') {
              $tag = "${{ github.ref_name }}"
              if ($tag -match '^v?(\d+\.\d+\.\d+.*)$' -and $tag -notlike "*/*") {
                  $ver = $matches[1]
              } else {
                  $ver = "4.0.0"
              }
          }
          New-Item -ItemType Directory -Path windows\dist -Force
          iscc /DMyAppVersion="$ver" windows/packaging/inno/setup.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glypdl-windows
          path: windows/dist/*.exe
