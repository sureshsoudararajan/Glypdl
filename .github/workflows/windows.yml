name: Windows Build & Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows 11 App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Dependencies
        run: msbuild windows/Glypdl.Windows.sln -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build Windows Solution
        run: msbuild windows/Glypdl.Windows.sln -p:Configuration=Release -p:Platform=x64

      - name: Run Windows Tests
        run: dotnet test windows/tests/Glypdl.Windows.Tests/Glypdl.Windows.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Publish Windows App (win-x64)
        run: msbuild windows/src/Glypdl.Windows/Glypdl.Windows.csproj -p:Configuration=Release -p:Platform=x64 -t:Publish -p:PublishDir="..\..\publish\" -p:SelfContained=true -p:RuntimeIdentifier=win-x64 -p:PublishSingleFile=false

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer (Setup.exe)
        run: |
          mkdir windows\dist
          iscc windows/packaging/inno/setup.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glypdl-Windows-Setup
          path: windows/dist/*.exe
