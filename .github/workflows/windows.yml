name: Windows Build & Installer

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows 11 App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore windows/Glypdl.Windows.sln -p:Platform=x64

      - name: Build Windows Solution
        run: dotnet build windows/Glypdl.Windows.sln -c Release -p:Platform=x64

      - name: Run Windows Tests
        run: dotnet test windows/tests/Glypdl.Windows.Tests/Glypdl.Windows.Tests.csproj --configuration Release -p:Platform=x64 --no-build

      - name: Publish Windows App (win-x64)
        run: |
          dotnet publish windows/src/Glypdl.Windows/Glypdl.Windows.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:PublishSingleFile=false -o windows/publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer (Setup.exe)
        run: |
          mkdir windows\dist
          iscc windows/packaging/inno/setup.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glypdl-Windows-Setup
          path: windows/dist/*.exe
