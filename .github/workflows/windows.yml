name: Windows Build & Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. 3.3.0)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 3.3.0)'
        required: false
        type: string
        default: '4.0.0'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows 11 App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Restore Dependencies
        run: msbuild windows/Glypdl.Windows.sln -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build Windows Solution
        run: msbuild windows/Glypdl.Windows.sln -p:Configuration=Release -p:Platform=x64

      - name: Run Windows Tests
        run: dotnet test windows/tests/Glypdl.Windows.Tests/Glypdl.Windows.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Publish Windows App (win-x64 Self-Contained)
        run: msbuild windows/src/Glypdl.Windows/Glypdl.Windows.csproj -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSelfContained=true -p:PublishDir="${{ github.workspace }}\windows\publish\"

      - name: Bundle and Verify Official yt-dlp Executable
        # Verified against the release's SHA2-256SUMS (and YTDLP_EXE_SHA256 if set); fails the
        # build on any mismatch. See .github/scripts/fetch-ytdlp.sh.
        shell: bash
        env:
          YTDLP_ASSET: yt-dlp.exe
          YTDLP_VERSION: ${{ vars.YTDLP_VERSION }}
          YTDLP_SHA256: ${{ vars.YTDLP_EXE_SHA256 }}
        run: bash .github/scripts/fetch-ytdlp.sh windows/publish/yt-dlp.exe

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Setup.exe
        shell: powershell
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver -or $ver -like "*/*" -or $ver -eq "main" -or $ver -notmatch '^\d') {
              $tag = "${{ github.ref_name }}"
              if ($tag -match '^v?(\d+\.\d+\.\d+.*)$' -and $tag -notlike "*/*") {
                  $ver = $matches[1]
              } else {
                  $ver = "4.0.0"
              }
          }
          New-Item -ItemType Directory -Path windows\dist -Force
          iscc /DMyAppVersion="$ver" windows/packaging/inno/setup.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glypdl-windows
          path: windows/dist/*.exe
