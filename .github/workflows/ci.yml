name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies & PyGObject
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 \
          python3-gi \
          python3-gi-cairo \
          gir1.2-gtk-4.0 \
          gir1.2-adw-1 \
          yt-dlp \
          ffmpeg \
          xvfb

    - name: Run Test Suite
      run: |
        xvfb-run -a python3 -m unittest discover -s tests -v
