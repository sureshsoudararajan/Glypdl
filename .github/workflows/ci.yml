name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Test Linux (GTK4 / Python)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies & PyGObject
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 \
          python3-gi \
          python3-gi-cairo \
          gir1.2-gtk-4.0 \
          gir1.2-adw-1 \
          yt-dlp \
          ffmpeg \
          xvfb

    - name: Run Test Suite
      env:
        PYTHONPATH: src
        GTK_A11Y: none
        GSK_RENDERER: cairo
        NO_AT_BRIDGE: 1
        LIBGL_ALWAYS_SOFTWARE: 1
      run: |
        xvfb-run -a python3 -m tests

  test-windows:
    name: Test Windows (WinUI 3 / .NET 8)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Dependencies
      run: msbuild windows/Glypdl.Windows.sln -t:Restore -p:Configuration=Debug -p:Platform=x64

    - name: Build Windows Solution
      run: msbuild windows/Glypdl.Windows.sln -p:Configuration=Debug -p:Platform=x64

    - name: Run Windows Tests
      run: dotnet test windows/tests/Glypdl.Windows.Tests/Glypdl.Windows.Tests.csproj -c Debug -p:Platform=x64 --no-build
