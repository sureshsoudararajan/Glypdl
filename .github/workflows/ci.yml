name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repo:
    name: Validate Scripts & Repository Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking packaging and helper shell scripts..."
          chmod +x packaging/deb/build_deb.sh packaging/appimage/build_appimage.sh packaging/rpm/build_rpm.sh
          bash -n packaging/deb/build_deb.sh
          bash -n packaging/appimage/build_appimage.sh
          bash -n packaging/rpm/build_rpm.sh
          if ls scripts/*.sh 1>/dev/null 2>&1; then
            for script in scripts/*.sh; do
              echo "Validating $script..."
              bash -n "$script"
            done
          fi

      - name: Validate Python Syntax
        run: |
          echo "Compiling Python source files to verify syntax..."
          python3 -m py_compile $(find src -name "*.py")
          python3 -m py_compile $(find tests -name "*.py")

      - name: Validate Configuration Files
        run: |
          echo "Validating JSON and package configs..."
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m json.tool extension/package.json >/dev/null
          bash -n PKGBUILD
